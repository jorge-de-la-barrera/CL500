[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cl500-monitor"
version = "0.1.0"
description = "Monitor de anuncios Honda CL500 en honda.appmoto.net"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Jorge de la Barrera" }
]
dependencies = [
  "beautifulsoup4>=4.12.0",
  "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "mypy>=1.8.0",
  "ruff>=0.4.0",
]

[project.scripts]
cl500-monitor = "cl500_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
